<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verse · Lyrics beta</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:white}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}[hidden]{display:none!important}
#overlay{--tone:62,58,112;--opacity:.42;width:280px;max-width:100%;border-radius:22px;background:linear-gradient(135deg,#ffffff2b,#ffffff05 45%,#ffffff12),rgba(var(--tone),var(--opacity));backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid #ffffff52;box-shadow:inset 0 1px 1px #ffffff65,inset 0 -1px 1px #ffffff15,0 8px 28px #18202d24;overflow:hidden;transition:background .7s ease;}
header{display:flex;align-items:center;gap:9px;padding:13px 12px 0;-webkit-app-region:drag;user-select:none}.art{width:28px;height:28px;flex-shrink:0;border-radius:8px;background:linear-gradient(140deg,#6864a5,#272140);box-shadow:inset 0 0 0 1px #ffffff25;display:grid;place-items:center;font-size:15px}.song-info{min-width:0;flex:1}.song-title{font-size:12px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:10px;color:#ffffffad;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}button{border:0;color:inherit;background:transparent;-webkit-app-region:no-drag}.icon{width:26px;height:28px;flex-shrink:0;border-radius:8px;font-size:18px;display:grid;place-items:center}.icon:hover{background:#ffffff18}.lyrics{padding:19px 17px 10px;display:flex;flex-direction:column;gap:8px}.lyric{margin:0;line-height:1.35;letter-spacing:-.3px}.current{font-size:19px;font-weight:550;text-shadow:0 1px 8px #0002;min-height:26px}.faded{font-size:13px;font-weight:400;color:#ffffffa8;min-height:18px}#previous{display:none}.progress{padding-top:12px}.seek{width:100%;height:3px;display:block;accent-color:#fff;cursor:pointer;margin:0}.times{display:flex;justify-content:space-between;font-size:10px;color:#ffffffa6;margin-top:9px;font-variant-numeric:tabular-nums}.bottom{display:flex;align-items:center;gap:5px;padding-top:8px}.demo{font-size:10px;color:#ffffffaa;flex:1}.settings{padding:0 17px 15px;border-top:1px solid #ffffff15}.settings label{display:flex;justify-content:space-between;font-size:11px;margin:12px 0 8px}.settings input{width:100%;accent-color:#fff}.next{font-size:11px;padding:8px;border-radius:8px}.next:hover{background:#ffffff16}#pill{display:flex;align-items:center;gap:9px;padding:11px 15px;width:fit-content;color:#fff;font-size:12px}#overlay.collapsed{width:fit-content;border-radius:40px}#overlay.collapsed #expanded{display:none}#overlay:not(.collapsed) #pill{display:none}.equalizer{display:flex;gap:2px;height:14px;align-items:center}.equalizer span{width:2px;border-radius:2px;background:white;height:9px}.equalizer span:nth-child(2){height:14px}.equalizer span:nth-child(3){height:6px}
body.preview{min-height:100vh;background:radial-gradient(ellipse at 12% 10%,#8c83b1 0%,transparent 35%),radial-gradient(ellipse at 78% 65%,#c7a9a1 0%,transparent 50%),linear-gradient(145deg,#adb5c8,#d9d6d7);padding:24px}body.preview #overlay{position:relative}.preview-note{position:fixed;bottom:24px;left:24px;color:#434654;font-size:11px;letter-spacing:.2px}@media(max-width:420px){body.preview{padding:14px}.preview-note{left:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.playback{display:flex;align-items:center;gap:9px;padding:0 17px 12px 12px}.playback .icon{width:24px;height:24px;font-size:12px;color:#ffffffc9}.playback .seek{flex:1;min-width:0;width:auto;appearance:none;-webkit-appearance:none;height:2px;border-radius:2px;background:linear-gradient(to right,#ffffffb8 var(--played,0%),#ffffff25 var(--played,0%));outline-offset:6px}.playback .seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:6px;height:6px;border-radius:50%;background:#fff}.playback .seek::-moz-range-thumb{width:6px;height:6px;border:0;border-radius:50%;background:#fff}
</style>
</head>
<body>
<section id="overlay" aria-label="Floating lyrics">
<div id="expanded">
<header><div class="art" id="art" aria-hidden="true">♪</div><div class="song-info"><div class="song-title" id="title"></div><div class="artist" id="artist"></div></div><button class="icon" id="settings-button" aria-label="Glass tint" aria-expanded="false">···</button><button class="icon" id="collapse" aria-label="Minimize lyrics">−</button></header>
<div class="lyrics" aria-label="Demo lyrics"><p class="lyric faded" id="previous"></p><p class="lyric current" id="current"></p><p class="lyric faded" id="following"></p></div>
<div class="playback"><button class="icon" id="play" aria-label="Pause demo">Ⅱ</button><input class="seek" id="seek" type="range" min="0" max="90" value="0" aria-label="Demo playback position"></div>
<div class="settings" id="settings" hidden><label for="opacity">Glass tint <span id="opacity-value">42%</span></label><input id="opacity" type="range" min="25" max="90" value="42"></div>
</div>
<button id="pill" aria-label="Expand lyrics"><span class="equalizer" aria-hidden="true"><span></span><span></span><span></span></span><span id="pill-title"></span><span aria-hidden="true">↗</span></button>
</section>
<div class="preview-note" id="preview-note" hidden>Verse · demo</div>
<script>
const overlay=document.getElementById('overlay');
const songs=[{title:'Afterglow',artist:'Verse Sessions',tone:'62,58,112',art:'radial-gradient(ellipse at 70% 20%,#d9bddc,transparent 45%),linear-gradient(140deg,#6864a5,#272140)',lines:['The city settles into blue','We leave the lights behind','And let the evening carry us','To somewhere out of time','Your shadow dances next to mine','Across the empty street','We keep a little daylight here','In every step we meet']},{title:'Tangerine Sky',artist:'Verse Sessions',tone:'122,62,41',art:'radial-gradient(circle at 65% 25%,#ffdab0,transparent 45%),linear-gradient(135deg,#bd704b,#503528)',lines:['The sun is slipping through the trees','A golden thread of light','We catch the colors as they fall','And hold them through the night','The road is warm beneath our feet','The air is soft and slow','We take the long way home again','With nowhere else to go']},{title:'Low Tide',artist:'Verse Sessions',tone:'34,83,77',art:'radial-gradient(ellipse at 70% 20%,#b3d9c4,transparent 45%),linear-gradient(135deg,#5c9a88,#183e44)',lines:['The water draws a silver line','Along the quiet shore','We listen to the ocean breathe','And ask for nothing more','A little wind, a little warmth','A place to start again','The tide will bring us back to here','We just don’t know quite when']}];
let songIndex=0,position=0,playing=true,last=performance.now();
const el=id=>document.getElementById(id);
function update(){const song=songs[songIndex];const index=Math.min(song.lines.length-1,Math.floor(position/12));el('previous').textContent=index?song.lines[index-1]:'♪';el('current').textContent=song.lines[index];el('following').textContent=song.lines[index+1]||'♪';el('seek').value=position;el('seek').style.setProperty('--played',(position/90*100)+'%');el('seek').setAttribute('aria-valuetext',Math.floor(position)+' seconds of 90');}
function loadSong(){const song=songs[songIndex];overlay.style.setProperty('--tone',song.tone);el('art').style.background=song.art;el('title').textContent=song.title;el('artist').textContent=song.artist;el('pill-title').textContent=song.title;position=0;update();}
function collapse(value){overlay.classList.toggle('collapsed',value);if(window.verse)window.verse.resize(value, !el('settings').hidden);(value?el('pill'):el('collapse')).focus();}
el('collapse').onclick=()=>collapse(true);el('pill').onclick=()=>collapse(false);
el('settings-button').onclick=()=>{el('settings').hidden=!el('settings').hidden;el('settings-button').setAttribute('aria-expanded',String(!el('settings').hidden));if(window.verse)window.verse.resize(false, !el('settings').hidden);};
el('opacity').oninput=event=>{overlay.style.setProperty('--opacity',event.target.value/100);el('opacity-value').textContent=event.target.value+'%';};
el('play').onclick=()=>{playing=!playing;last=performance.now();el('play').textContent=playing?'Ⅱ':'▶';el('play').setAttribute('aria-label',playing?'Pause demo':'Play demo');};
el('seek').oninput=event=>{position=Number(event.target.value);last=performance.now();update();};
setInterval(()=>{const now=performance.now();if(playing){position+=(now-last)/1000;if(position>=90){songIndex=(songIndex+1)%songs.length;loadSong();}update();}last=now;},200);
if(!window.verse){document.body.classList.add('preview');el('preview-note').hidden=false;}
loadSong();
</script>
</body></html>
